plugins { id 'com.android.application' }
android {
    namespace 'com.johansystems.chess'
    compileSdk 35
    defaultConfig {
        applicationId 'com.johansystems.chess'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.3.0'
    }
    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets { main { assets.srcDirs = ['../../public'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
}
tasks.named('preBuild').configure {
    doFirst {
        if (!file('../../public/engine-path.js').exists() || !file('../../public/chess.js').exists())
            throw new GradleException('Run npm install at the repository root before building the APK.')
    }
}
