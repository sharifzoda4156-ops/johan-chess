name: Quality checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'android/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'server.mjs'
      - 'package.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: find public lib scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: Test native absence state machine
        run: |
          mkdir -p /tmp/jc-guard
          javac -d /tmp/jc-guard android/app/src/main/java/com/johansystems/chess/OnlineAbsence.java test/native/OnlineAbsenceTest.java
          java -cp /tmp/jc-guard com.johansystems.chess.OnlineAbsenceTest
