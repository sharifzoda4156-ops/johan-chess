name: Quality checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'android/**'
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'server.mjs'
      - 'package.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: find public lib scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: Test fixed chess layout in Chrome
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.51.1
          node scripts/check-game-layout.mjs
      - name: Test native opponent presence policy
        run: |
          mkdir -p "$RUNNER_TEMP/online-tests"
          javac -d "$RUNNER_TEMP/online-tests" android/app/src/main/java/com/johansystems/chess/OpponentPresence.java test/native/OpponentPresenceTest.java
          java -cp "$RUNNER_TEMP/online-tests" com.johansystems.chess.OpponentPresenceTest
