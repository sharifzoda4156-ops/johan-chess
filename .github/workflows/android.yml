name: Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (e.g. v0.2.0) to publish the APK'
        required: false
        type: string
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Johan-Chess-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          APK_NAME="Johan-Chess-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_NAME}" --clobber
          else
            gh release create "${TAG}" "${APK_NAME}" \
              --target "${GITHUB_SHA}" \
              --latest \
              --title "Johan Chess ${TAG}" \
              --notes-file - <<'EOF'
          ## Скачать Android APK
          Нажмите на файл `.apk` в разделе **Assets** ниже, чтобы скачать и установить приложение на Android (без архива и без входа в GitHub).

          ## Что нового
          - **Новый дизайн Onyx & Emerald**: фирменный логотип J-Knight, адаптивная иконка Android, 4 палитры доски и 5 наборов фигур Lichess.
          - **Обновлённая навигация**: разделённые экраны Главной, меню «Новая игра» (в стиле Chess.com) и настройки игры против бота с выбором уровня и цвета.
          - **Улучшенный геймплей**: Drag & Drop фигур, подсветка шаха, отображение взятых фигур и баланса материала, синтезатор звуков ходов, обновлённый график оценки.
          - **Онлайн-игра и импорт**: вход через Lichess OAuth2 PKCE, импорт партий с Lichess, Chess.com и PGN, улучшенная работа с файлами и кнопкой «Назад» на Android.
          - **Веб-версия**: https://sharifzoda4156-ops.github.io/johan-chess/
          EOF
          fi
