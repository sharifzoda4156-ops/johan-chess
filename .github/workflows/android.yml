name: Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (e.g. v0.2.0) to publish the APK'
        required: false
        type: string
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/johan-chess.keystore"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            export ANDROID_KEYSTORE_PATH="${KEYSTORE_FILE}"
            gradle -p android :app:assembleRelease
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${APK_PATH}"
            rm -f "${KEYSTORE_FILE}"
            echo "APK_PATH=${APK_PATH}" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=Johan-Chess-Android-release" >> "$GITHUB_ENV"
          else
            gradle -p android :app:assembleDebug
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=Johan-Chess-Android-debug" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          APK_NAME="Johan-Chess-${TAG}.apk"
          cp "${APK_PATH}" "${APK_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_NAME}" --clobber
          else
            gh release create "${TAG}" "${APK_NAME}" \
              --target "${GITHUB_SHA}" \
              --latest \
              --title "Johan Chess ${TAG}" \
              --notes-file - <<'EOF'
          ## Скачать Android APK
          Нажмите на файл `.apk` в разделе **Assets** ниже, чтобы скачать и установить приложение на Android (без архива и без входа в GitHub).

          ## Что нового
          - **Стабильный онлайн Lichess (v0.3.1)**: исправлено зависание партии после нахождения соперника на Android (убрана привязка потоков к `hasWindowFocus()` и `NET_CAPABILITY_VALIDATED`, устранена гонка `seek`/`gameStart`/`refresh`, добавлена очередь `pollQueued`, живой обратный отсчёт 1-го хода, кнопка «Отменить партию» (`/abort`) и мгновенный ресинк по иконке сигнала).
          - **Надёжный запуск Stockfish в браузере (v0.3.1)**: собственный загрузчик воркера без сбоя `instantiateStreaming` в Opera Mobile, постоянный кэш `CacheStorage`, прогресс скачивания в процентах и МБ, авто-фолбэк на ASM.js.
          - **Постоянная подпись Android APK**: обновления устанавливаются поверх без удаления приложения.
          - **Плавная физика доски, экраны партий, чат и Game Review в стиле Chess.com**: `!!` Блестящие ходы, `!`, `★`, `📖`, `??`, Eval Bar, 2-шаговая подсказка Stockfish и Undo.
          - **Веб-версия**: https://sharifzoda4156-ops.github.io/johan-chess/
          EOF
          fi
