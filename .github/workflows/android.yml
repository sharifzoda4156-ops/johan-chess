name: Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (e.g. v0.2.0) to publish the APK'
        required: false
        type: string
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Johan-Chess-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          APK_NAME="Johan-Chess-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_NAME}" --clobber
          else
            gh release create "${TAG}" "${APK_NAME}" \
              --target "${GITHUB_SHA}" \
              --latest \
              --title "Johan Chess ${TAG}" \
              --notes-file - <<'EOF'
          ## Скачать Android APK
          Нажмите на файл `.apk` в разделе **Assets** ниже, чтобы скачать и установить приложение на Android (без архива и без входа в GitHub).

          ## Что нового
          - **Плавная физика доски (как в Chess.com)**: мгновенный отклик `pointerdown`, приподнятый drag-ghost под пальцем, отсутствие двойной анимации после перетаскивания, мгновенные оптимистичные ходы в онлайне, графический SVG-выбор превращения пешки, SVG-стрелки и угловые бейджи.
          - **Экраны партий против бота и онлайн**: полноширинная доска на мобильных, шторка настроек партии (Сдаться / Предложить ничью / Перевернуть / Звук / Анимация), просмотр истории ходов `‹ / ›` прямо во время партии, двушаговая подсказка сильнейшего Stockfish (1-й клик — фигура, 2-й клик — стрелка хода) и отмена хода (`Undo`) в режиме бота и задач.
          - **Живой чат во время партии**: реальный чат Lichess (`chatLine` + `POST /chat`) на Web и Android APK, быстрые реплики и ненавязчивый чат с ботами.
          - **Анализ партий в стиле Chess.com (Game Review)**: MultiPV-анализ, 10 категорий ходов (`!!` Блестящий, `!` Отличный, `★` Лучший, `📖` Теория, `✖` Упущение, `??` Зевок и др.), определение дебюта, анимированная шкала оценки (Eval Bar), бейджи и стрелки лучшего хода на доске, сводная таблица по категориям, ориентировочный рейтинг партии, интерактивное исследование, 2-шаговая подсказка Stockfish и кнопка «Повторить ошибку».
          - **Веб-версия**: https://sharifzoda4156-ops.github.io/johan-chess/
          EOF
          fi
